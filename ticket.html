<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Coding Conf | Your Ticket
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <nav aria-label="Main navigation">
    <a href="index.html">
     <img alt="Coding Conf home" class="logo" src="assets/images/logo-full.svg"/>
    </a>
   </nav>
  </header>
  <main>
   <section>
    <h1>
     Congrats,
     <em id="greeting-name">
     </em>
     !
     <br/>
     Your ticket is ready.
    </h1>
    <p class="lead">
     We've reserved your place at Coding Conf 2026. We can't wait to see you there!
    </p>
    <article aria-label="Your conference ticket" class="ticket">
     <div class="ticket-top">
      <div class="ticket-brand">
       <img alt="" src="assets/images/logo-mark.svg"/>
       Coding Conf
      </div>
      <p class="ticket-date">
       Oct 26, 2026 / Papine, Kgn
      </p>
     </div>
     <div class="ticket-bottom">
      <img alt="Attendee avatar" class="avatar" id="ticket-avatar"/>
      <div class="attendee">
       <strong id="ticket-name">
       </strong>
       <p>
        <img alt="" height="17" src="assets/images/icon-github.svg" width="17"/>
        <a id="ticket-github" rel="noopener noreferrer" target="_blank">
        </a>
       </p>
      </div>
      <span class="serial" id="ticket-serial">
      </span>
     </div>
    </article>
    <a class="back" href="index.html">
     ← Return to home
    </a>
   </section>
  </main>
  <footer>
   Coding Conf · Your adventure begins here.
  </footer>
  <script src="js/ticket.js">
  </script>
 </body>
</html>
